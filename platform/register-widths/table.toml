# Which bits of the SGX registers take a write (sub-phase 11.3): every register the glossary places
# at an offset, and the 13 the firmware or the init script touches with no glossary row, either
# written with all ones and zero and put back (regwidth.c through /dev/mem, firmware live and idle,
# in batches with a fill and the triangle checked after each) or kept read-only with its reason.
# Batch 1 holds five registers whose bits earlier records measured (0x0418, 0x04dc, 0x0520 through
# kreg, 0x02b4, 0x0368 through the TA command), as a check of the method; 0x0b30, set once by the
# init script and never reached by the firmware, runs alone, last.
kind = "regwidth"
name = "platform-register-widths"
needs = ["kreg", "regs"]

