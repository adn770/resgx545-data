# ta zero words: 1 sweeps, 26 probes, hand-run script.
needs = ["render", "kpoke", "render_param", "render_tadata"]
script = "zero-words.sh"
name = "ta-zero-words"
about = "the zero TA and render-detail words as addresses into the scratch pages, six forms"
host = "tri"
options = ["--scratch", "16"]
bits = []
values = ["=0x3e003000", "=0x5000", "=0x700", "=0x3e009001", "=0xb001", "=0xd"]

[[range]]
space = "ta"
indices = [155, 156]

[[range]]
space = "ta"
indices = [158, 168]

[[range]]
space = "rd"
indices = [9, 9]

[[range]]
space = "rd"
indices = [19, 19]

[[probe]]
name = "ta-zero-words-cull-culled"
question = "the TA's output for our triangle culled (MTECTL cull mode 1), the baseline"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
blk = { 15 = 0x1555621 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "ta-zero-words-cull-culled-ta155"
question = "the TA's output for our triangle culled (MTECTL cull mode 1) with ta:155 at ~0"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
blk = { 15 = 0x1555621 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true
kpoke = ["ta:155=0xffffffff"]

