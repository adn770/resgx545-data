# pbe emit words followup: 3 sweeps, 2 probes (written by tools/usse-asm/pbe_words.py).
# emit-words again: the fields, 12 values of bits 15:8, dword 8.
needs = ["render"]
name = "pbe-emit-words-followup"

[[sweep]]
name = "pbe-emit-words-followup-pixev-fill"
about = "the fill's pixel-event data dword 8, E046's values and single bits"
host = "fill"
bits = []
values = ["^=0x100", "^=0x8100", "^=0x300", "^=0x4100", "^=0x8000", "=0", "=0x2", "=0x4", "=0x8", "=0x200"]
repeat = 1

[[sweep.range]]
space = "pds:pixev"
indices = [8, 8]

[[sweep]]
name = "pbe-emit-words-followup-pixev-copy"
about = "the copy's pixel-event data dword 8, E046's values and single bits"
host = "copy"
bits = []
values = ["^=0x100", "^=0x8100", "^=0x300", "^=0x4100", "^=0x8000", "=0", "=0x2", "=0x4", "=0x8", "=0x200"]
repeat = 1

[[sweep.range]]
space = "pds:pixev"
indices = [8, 8]

[[sweep]]
name = "pbe-emit-words-followup-pixev-tri"
about = "the tri's pixel-event data dword 8, E046's values and single bits"
host = "tri"
bits = []
values = ["^=0x100", "^=0x8100", "^=0x300", "^=0x4100", "^=0x8000", "=0", "=0x2", "=0x4", "=0x8", "=0x200"]
repeat = 1

[[sweep.range]]
space = "pds:pixev"
indices = [8, 8]

