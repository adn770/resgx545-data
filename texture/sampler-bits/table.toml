# texture sampler bits: 2 sweeps, 0 probes.
# Every bit of the copy's T0, T1 and T3 flipped (and 0, 0xffffffff), every pixel read back.
name = "texture-sampler-bits"
needs = ["render"]

[[sweep]]
name = "texture-sampler-bits-copy"
about = "the copy's texture words T0, T1 and T3, plain source, every pixel"
host = "copy"
options = ["--pixels"]

[[sweep.range]]
space = "tex"
indices = [0, 1]

[[sweep.range]]
space = "tex"
indices = [3, 3]

[[sweep]]
name = "texture-sampler-bits-copy-every"
about = "the copy's texture words T0, T1 and T3, every-value source, every pixel"
host = "copy"
options = ["--every-value", "--pixels"]

[[sweep.range]]
space = "tex"
indices = [0, 1]

[[sweep.range]]
space = "tex"
indices = [3, 3]
