# texture state words: 2 sweeps, 0 probes.
name = "texture-state-words"
needs = ["render"]

[[sweep]]
name = "texture-state-words-copy-every-tex-bg"
about = "a 64x32 copy's texture words and background object, every-value source"
host = "copy"
options = ["--every-value"]

[[sweep.range]]
space = "tex"

[[sweep.range]]
space = "bg"

[[sweep]]
name = "texture-state-words-copy-tex-bg"
about = "a 64x32 copy's texture words and background object"
host = "copy"

[[sweep.range]]
space = "tex"

[[sweep.range]]
space = "bg"
