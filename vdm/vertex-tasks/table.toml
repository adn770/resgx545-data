# vdm vertex tasks: 1 sweeps, 11 probes.
needs = ["render", "render_param", "render_tadata"]
name = "vdm-vertex-tasks"
about = "every value of the triangle's vertex-task word 0 (vdm:6) bits 31:28, 15 in our stream"
host = "tri"
bits = []
values = ["^=0x10000000", "^=0x20000000", "^=0x30000000", "^=0x40000000", "^=0x50000000", "^=0x60000000", "^=0x70000000", "^=0x80000000", "^=0x90000000", "^=0xa0000000", "^=0xb0000000", "^=0xc0000000", "^=0xd0000000", "^=0xe0000000", "^=0xf0000000"]

[[range]]
space = "vdm"
indices = [6, 6]

[[probe]]
name = "vdm-vertex-tasks-vdm-task-7"
question = "what the TA writes with VDM_TASK0 bits 31:28 = 7"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
vdm_xor = { 6 = 0x80000000 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "vdm-vertex-tasks-vdm-task-1"
question = "what the TA writes with VDM_TASK0 bits 31:28 = 1"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
vdm_xor = { 6 = 0xe0000000 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "vdm-vertex-tasks-vdm-task-0"
question = "what the TA writes with VDM_TASK0 bits 31:28 = 0"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
vdm_xor = { 6 = 0xf0000000 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "vdm-vertex-tasks-vtxtask-15"
question = "VDM_TASK0 bits 31:28 = 15: the vertices' quad neighbours (task grouping)"
source = "vtx_task.s"
host = "tri"
slot = "vtxuse"
size = [64, 64]
vertices = 126
temps = 16
pixels = true
cases = [[]]
labels = ["field 15"]

