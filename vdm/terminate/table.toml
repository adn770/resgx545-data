# vdm terminate: 1 sweeps, 0 probes.
needs = ["render"]
name = "vdm-terminate"
about = "values of both halves of the triangle's terminate word, repeated"
host = "tri"
bits = []
values = ["^=0x1", "^=0x2", "^=0x3", "^=0x4", "^=0x5", "^=0x6", "^=0x7", "^=0x8", "^=0x9", "^=0xa", "^=0xb", "^=0xc", "^=0xd", "^=0xe", "^=0xf", "^=0x10000", "^=0x20000", "^=0x30000", "^=0x40000", "^=0x50000", "^=0x60000", "^=0x70000", "^=0x80000", "^=0x90000", "^=0xa0000", "^=0xb0000", "^=0xc0000", "^=0xd0000", "^=0xe0000", "^=0xf0000"]
repeat = 3

[[range]]
space = "eos"
indices = [1, 1]
