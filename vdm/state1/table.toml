labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "vdm-state1-lines3"
question = "what the TA writes before three-index lines hang"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
blk = { 1 = 0x1d08200 }
vdm = { 2 = 0x84c00003 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

[[probe]]
name = "vdm-state1-hang-pixel"
question = "whether a job hung in its pixel task leaves its objects in the PB pages after recovery"
source = "pds_iter_nofetch.s"
host = "tri"
slot = "pixpds"
slots = { pixel = "pix_pa0.s", vtxuse = "vtx_coords.s" }
vtx_coords = 2
size = [64, 64]
pixels = true
inputs = ["A", "B", "U"]
cases = [[0x800, 0, 0x1000004]]
labels = ["U1 bit 24, DOUTI0 bit 29 clear: hangs in the pixel task"]
dump_render = true

[[probe]]
name = "vdm-state1-vdm-state-bit8"
question = "what the TA writes with VDM_STATE1 bit 8 set"
source = "pix_op.s"
host = "tri"
slot = "pixel"
size = [64, 64]
vdm_xor = { 1 = 0x100 }
pixels = true
inputs = ["OP"]
cases = [["mov.skipinv.end o0, o0"]]
labels = ["o0 = o0"]
dump_render = true

