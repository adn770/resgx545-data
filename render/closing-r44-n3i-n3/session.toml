# session.toml: the env of r44-n3i-n3, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r44-n3i-n3"
prefix = "r44i3"                  # laptop files under ~/scratch/r44i3/ (run, stage, out)
# the r42-kernel module (fork r42-kernel ec6511d5de87) the laptop runs since round 42: no rebuild
srcversion = "079DD0D13F231EEAC52FE0F"               # the gma500 module: loaded = installed = this build
host_key_alias = "cedar"       # ssh HostKeyAlias, unless SGX_TARGET_SSH_OPTS names one
job_timeout = 60                    # seconds one job may take (timeout -k 10)
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t30"            # the tool of the health fill and triangle and the gate
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # options naming a file the tool writes
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--kpoke", "--low", "--late", "--scratch-heap", "--tri", "--fault", "--place",
                  "--poke", "--pds", "--use", "--slot", "--scratch-at", "--refill", "--ctx2"]
                                    # no stage runs a tool row: every row is an owntask row

[tools.t30]
path = "sgxfive-test-t30"
sha256 = "b5ea288d273f0da50884bbeec38f784a5d19773b8ed20efc7937dd455c1b87a5"
built_from = "42c4de7855d6f310321cc03fa0780b698a735e4d:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "253fd15bcb6a0a6381d20aacbb635af1c99d764388f394f9a24dc61266b6418d"
recipe = "data:render/closing-r30-pde/lead/build_tool30_laptop.sh"
source = "42c4de7855d6f310321cc03fa0780b698a735e4d:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "253fd15bcb6a0a6381d20aacbb635af1c99d764388f394f9a24dc61266b6418d"

[knobs]

[kregs]

# the stages in run order; every one flagged, on_stop "end" (any stop ends the session);
# K7 (round 43), K8 (round 44): a plant stage runs no gate and no end draws; a read stage
# runs no gate and declares the draw sequence it reads after (begin_draws, a list)
[stages]
# wf: N3i row W, emitsb_sbc43s (emitsb_sbc43 with the cmd 6 after-read), mark at pdsat=fw14, form=sbc43; 1 job in one row
wf = { alarm = 600, class = "flagged", on_stop = "end", own_gate = "none", end_draws = "none", owntask = { blob = "emitsb_sbc43s", arm = "slots=0x1 entry=0 pds=mark pdsat=fw14 form=sbc43" } }
# lf: N3i row LF, emitsb_sbc43s (emitsb_sbc43 with the cmd 6 after-read), land at pdsat=fw14, form=sbc43; 2 jobs in one row
lf = { alarm = 600, class = "flagged", on_stop = "end", begin_draws = "fill", owntask = { blob = "emitsb_sbc43s", arm = "slots=0x1 entry=0 pds=land pdsat=fw14 form=sbc43" } }

# the commits the kit copies and every pinned input are frozen against
[freeze]
resgx545 = "ce01a0c4deb77470f314f0c873cc4653b6cd706c"
data = "b3df8fc21aff405bc58a9c59bc8d773040069162"
# the blob's and its base's sources (tests/test_gen.py); round 43's kept stages N1 w, N1
# v and N2 f: the hooks' V0-V3 fallback (w's snap0) and the bases of the scorer's
# test attempts (tests/attempt.py)
pins = [
    "resgx545:asm/fwtask/emitsb_sbc43s.s",
    "resgx545:asm/fwtask/emitsb_sbc43.s",
    "data:render/closing-r43-n3h-n1/out/20261123-164401/w/w1-a.own_res.json.gz",
