# session.toml: the env of r20-own, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r20-own"
prefix = "r20o"                 # laptop files under ~/scratch/r20o/ (run, stage, out)
srcversion = "E0CC40275493F8AEAD8180B"               # the gma500 module: loaded = installed = this build
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10)
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = ["render_kept", "render_words", "buf09", "kpoke"]   # --kept-copy, --words (render_words
                                    # and buf09), --kpoke-render (r19-own1b's)
outdir_opts = []                    # options naming a file the tool writes: its directory is made
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--fault", "--scratch-at", "--kpoke-job", "--kpoke-fill", "--kpoke-render2",
                  "--tadata-fill-render", "--refill", "--low", "--late", "--kreg-render",
                  "--kreg-render2", "--final-pb-pages", "--geometry", "--share-pb",
                  "--overlap"]   # r19-own1b's list: the rows' only poke is --kpoke-render 1:ta:7^=0xc,
                                 # their only change of scene --move 1:DX,DY (the owner's)

[tools.t10]
path = "sgxfive-test-t10"
sha256 = "9bedc2d6db70b2691698478572e311cf2b9b54acfaf8d714ed4db47852e322eb"
built_from = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"
recipe = "data:render/closing-r10-st1/lead/build_tool10.sh"
source = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"

[tools.t18b]
path = "sgxfive-test-t18b"
sha256 = "58e7985504d0d3311155d94627da8b8473335d9a843f5610e44731864315b21e"
built_from = "ec50498e6b5cbf3ebff07233da508023dd28f4a2:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "70aa910e14ae8040072b8c2cde5991830c4dcfe6bcd35ccf722c080ee9f38e29"
recipe = "data:render/closing-r19-own/lead/build_tool18b.sh"
source = "ec50498e6b5cbf3ebff07233da508023dd28f4a2:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "70aa910e14ae8040072b8c2cde5991830c4dcfe6bcd35ccf722c080ee9f38e29"

[tools.rt]
wraps = true
path = "regtimeline"
sha256 = "079f63590ce87ff2a1ac5499291e52340ff448d9c5e41942a9420264764de803"
no_source = "regtimeline (tools/sweep/regtimeline.c): a read-only register sampler that wraps t18b; the wrapped command is replayed"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]
# render_keep (E591): the next render context closed keeps its mappings, slot and TA data, once;
# every row arms it. render_pb_pages: the P of every render context the row creates (both
# contexts, E625). render_final_pb_pages: declared at 0 only (t18b; no row passes
# --final-pb-pages, BRIEF-BUILDER).
render_keep = { default = "0", values = ["0", "1"] }
render_pb_pages = { default = "0x422", values = ["0x422", "0x30", "0x2c", "0x34"] }
render_final_pb_pages = { default = "0", values = ["0"] }

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next")
[stages]
# closing20/plan/rank-round20.md section 4 (S2), in its order; no stage depends on another's result
# (on_stop "next"); ow's control ow-c gates ow's own headline (score.py: a FAILED control voids it)
ow = { alarm = 600 }
owt = { alarm = 300 }
owp = { alarm = 600 }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "c0f8c41fbbf9fb40687abb4a9f68116a6174e566"
data = "ba3990f01eb2b2a29fce03c9f48dd071d89b34e6"
# gen/make.py's reference pages (E1087's o1-big-a, E1084's o2-p30) and the kept records
# tests/test_score.py replays the scorer on (E1087, E1084)
pins = [
    "data:render/closing-r19-own1b/out/20261114-230658/own1/o1-big-a.kept.1.bin.gz",
    "data:render/closing-r19-own1b/out/20261114-230658/own1/o1-big-a.kept.closed.1.bin.gz",
    "data:render/closing-r19-own1b/out/20261114-230658/own1/o1-big-a.ta3d.101.bin.gz",
    "data:render/closing-r19-own1b/out/20261114-230658/own1/o1-big-a.words.101.txt.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-p30.kept.1.bin.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-p30.kept.closed.1.bin.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-p30.ta3d.101.bin.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-c-a.kept.1.bin.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-c-a.kept.closed.1.bin.gz",
    "data:render/closing-r19-own/out/20261114-223625/own2/o2-c-a.ta3d.101.bin.gz",
]

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = []
