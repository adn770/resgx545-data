# session.toml: the env of r9-lgeo (round 9, session S9-lgeo: Q283, Q139), a closing session built with the
# session kit (HACKING.md, "Session kit"). kit/session.py writes run/session.env from it for the laptop. Plan:
# closing9/seeds/exp-seeds-r9.md sections 5 and 6 (S-4 (a)); decisions closing9/DECISIONS-R9.md (safe class
# only: no held reset, no planned fault, #limit 0 in every table). zs3 (Q260) is not in this session.
name = "r9-lgeo"
prefix = "r9m"                 # laptop files under ~/scratch/r9m/ (run, stage, out)
srcversion = "B60AB0B475DD1E8972419B5"               # the gma500 module: loaded = installed = this build
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10): the longest, q139b's 1280 x 720 --pixels
min_free_mb = 400                   # MiB free on ~ before each job (q139b's 1280 x 720 dumps and text)
health_tool = "t4"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # --dump-render "$W" writes into the job's work directory, which exists
extra_knobs = ["needhash", "needrows"]   # run/hooks.sh: the second row without a hash / pixel rows stops the stage
forbid_options = ["--poke", "--kpoke-fill", "--tadata-fill-render", "--scratch-at", "--low", "--late", "--scratch-pages"]

[tools.t4]
path = "sgxfive-test-rgn4"
sha256 = "e6951558a93b4b7bc750eeae302997992d7ec6e26719bc527ba1ffc9c6fb779a"
built_from = "4623753f2cc5b9a34b357736801a4c6e66138bf9:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "703cbceaae8cdff3eda280b7ef89f3c5ef14ba7d378dd269bc66ef714aaead69"
recipe = "userspace/libsgxfive/Makefile"
source = "4623753f2cc5b9a34b357736801a4c6e66138bf9:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "703cbceaae8cdff3eda280b7ef89f3c5ef14ba7d378dd269bc66ef714aaead69"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap: none here
[knobs]

# the stages in run order; alarm: the Mac's bound on the stage (s); no stage is gated by another's controls
[stages]
tx6 = { alarm = 900 }
q139b = { alarm = 900 }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
