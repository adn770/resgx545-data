# session.toml: the env of r8-lgeo (round 8, round 7's leftovers session L2: Q283, Q178, Q260, Q139), a
# closing session built with the session kit (HACKING.md, "Session kit"). kit/session.py writes run/session.env
# from it for the laptop. Plan: closing8/leftovers/exp-leftovers-r8.md section 3; decisions DECISIONS-R8.md R8-8
# (safe class only: no held reset, no planned fault, #limit 0 in every table).
name = "r8-lgeo"
prefix = "r8m"                 # laptop files under ~/scratch/r8m/ (run, stage, out)
srcversion = "37EC97AB0CB37213C42FCCC"               # the gma500 module: loaded = installed = this build (before R8-5's boot)
host_key_alias = "sgx-target"       # ssh HostKeyAlias; SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10): the longest, q139's 1280 x 720 --pixels
min_free_mb = 400                   # MiB free on ~ before each job (q139's 640 x 480 and 1280 x 720 dumps and text)
health_tool = "t4"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # --dump-render "$W" writes into the job's work directory, which exists
extra_knobs = ["needhash", "needrows"]   # run/hooks.sh: the second row without a hash / pixel rows stops the stage
forbid_options = ["--poke", "--kpoke-fill", "--tadata-fill-render", "--scratch-at", "--low", "--late"]

[tools.t4]
path = "sgxfive-test-rgn4"
sha256 = "e6951558a93b4b7bc750eeae302997992d7ec6e26719bc527ba1ffc9c6fb779a"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap: none here
[knobs]

# the stages in run order; alarm: the Mac's bound on the stage (s); no stage is gated by another's controls
[stages]
tx3 = { alarm = 900 }
tx4 = { alarm = 1200 }
tx5 = { alarm = 1200 }
zs2 = { alarm = 2400 }
q139 = { alarm = 1200 }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "91f21da60ba41207a32d3770649e2577c9e427d8"
