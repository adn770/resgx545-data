# session.toml: the env of r35-pk, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r35-pk"
prefix = "r35p"                 # laptop files under ~/scratch/r35p/ (run, stage, out)
srcversion = "7CE8E38EDB97FC5EA4F6C90"               # the gma500 module: loaded = installed = this build
host_key_alias = "cedar"            # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10); E031, E385 and
                                    # r34-q044 probes of this form ran in under 2 s
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # options naming a file the tool writes: its directory is made
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--fault", "--scratch-at", "--kpoke-job", "--kpoke-fill", "--kpoke-render",
                  "--kpoke-render2", "--tadata-fill-render", "--refill", "--low", "--late",
                  "--index-width", "--kpoke", "--poke", "--blk", "--vdm", "--pbe"]   # none of this session's premises

[tools.t10]
path = "sgxfive-test-t10"
sha256 = "9bedc2d6db70b2691698478572e311cf2b9b54acfaf8d714ed4db47852e322eb"
built_from = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"
recipe = "data:render/closing-r10-st1/lead/build_tool10.sh"
source = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]

# a register a flagged stage's rows may write (kreg:OFF=V), on the kit's allow-list only
# (KREG_ALLOWED: 0x0a78 up to 0x3f), restored to the kit's default (0x2c) after each job and by
# the exit trap:
#   "0x0a78" = { values = ["0x00", "0x01"] }
[kregs]

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next");
# class = "flagged": a stage of planned faults, hangs or kreg writes, after every safe stage
# s0 (9 controls, a stop ends the session), r1 (15), r2 (41), r3 (20), pw (modes 12 and 13, which
# write past the target, 7) last; r1, r2, r3, pw gated on s0
[stages]
s0 = { alarm = 900, on_stop = "end" }
r1 = { alarm = 1200, gate = true }
r2 = { alarm = 2400, gate = true }
r3 = { alarm = 1200, gate = true }
pw = { alarm = 900, gate = true }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "eea6d2ab8f452cc64ebc57824a29ac92fa550bde"
data = "1f5ebe6b6e9d849a6bf66188f9d892f464dd91d4"
# every repository file gen/make.py and the tests read: E031's kept images and bins, E385's pds
# and vertex programs and its mode 0 and mode 5 images (the H-RZ fit), E382's kept xy image (pa0,
# pa1 and the triangle)
pins = [
    "data:pbe/emit-transforms/pbe-emit-transforms-xy/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-00/bins/eot_plain.bin",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-00/bins/pbe-pack-modes-packmode-00__0.bin",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-03/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-04/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-05/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-06/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-07/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-09/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-10/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-12/raw.txt",
    "data:pbe/pack-modes/pbe-pack-modes-packmode-13/raw.txt",
    "data:pbe/reg-0400-alpha/pbe-reg-0400-alpha-bit25-mode5/raw.txt",
    "data:pbe/reg-0400-alpha/pbe-reg-0400-alpha-mode0/raw.txt",
    "data:pbe/reg-0400-alpha/pbe-reg-0400-alpha-mode4/bins/pds_iter_xy.bin",
    "data:pbe/reg-0400-alpha/pbe-reg-0400-alpha-mode4/bins/vtx_coords.bin",
]

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = ["bins/*.bin"]
