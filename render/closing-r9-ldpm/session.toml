# session.toml: the env of r9-ldpm (round 9, session S9-ldpm of closing9/seeds/exp-seeds-r9.md
# section 7: Q210 and Q211, decision R9-5 (a), safe class only), built with the session kit
# (HACKING.md, "Session kit"). kit/session.py writes run/session.env from it for the laptop.
# gen/plan.py writes the tables and predictions; tests/test_plan.py holds extra_knobs and the knob
# values equal to them.
name = "r9-ldpm"
prefix = "r9l"                 # laptop files under ~/scratch/r9l/ (run, stage, out)
srcversion = "B60AB0B475DD1E8972419B5"   # the test module of fork 2a650d74, loaded since 03:11
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10; r8-ldpm's)
min_free_mb = 300                   # MiB free on ~ before each job (4 dumped jobs, up to 3 MB each)
health_tool = "t4"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # every file the tool writes goes to "$W" itself
forbid_options = ["--kpoke-render", "--kpoke-job", "--fault", "--poke", "--blk", "--cmd", "--vdm", "--vtx-coords", "--slot"]
# the session's own knob words, read by run/hooks.sh: a control's frozen value (hook_check)
extra_knobs = [
    "ctl:gps_left=0x1",
    "ctl:gps_left=0x2",
    "ctl:need=0x19f",
    "ctl:need=0x213",
    "ctl:need=0x28c",
    "ctl:need=0xe2",
    "ctl:nparts=0",
    "ctl:nparts=2",
    "ctl:runpeaks=0x80,0xa0,0x2",
]

[tools.t4]
path = "sgxfive-test-rgn4"
sha256 = "e6951558a93b4b7bc750eeae302997992d7ec6e26719bc527ba1ffc9c6fb779a"
built_from = "4623753f2cc5b9a34b357736801a4c6e66138bf9:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "703cbceaae8cdff3eda280b7ef89f3c5ef14ba7d378dd269bc66ef714aaead69"
recipe = "userspace/libsgxfive/Makefile"
source = "4623753f2cc5b9a34b357736801a4c6e66138bf9:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "703cbceaae8cdff3eda280b7ef89f3c5ef14ba7d378dd269bc66ef714aaead69"

[tools.rt]                          # S1's regtimeline (tools/sweep/regtimeline.c), read-only
path = "regtimeline"
sha256 = "079f63590ce87ff2a1ac5499291e52340ff448d9c5e41942a9420264764de803"
wraps = true
no_source = "regtimeline (tools/sweep/regtimeline.c, S1's binary): a read-only register sampler that wraps t4; the wrapped t4 command is replayed"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
# P = thr0 + 0x22 of every row (gen/plan.py), default 0x422 (R5-dpm to r8-ldpm)
[knobs]
render_pb_pages = { default = "0x422", values = ["0x64", "0x66", "0x84", "0x86", "0x94", "0xa2", "0xac", "0xb9", "0xbf", "0xfb", "0x100", "0x104", "0x105", "0x10f", "0x12b", "0x12c", "0x12d", "0x162", "0x182", "0x183", "0x184", "0x185", "0x186", "0x1db", "0x1dc", "0x1dd", "0x1de", "0x1df", "0x218", "0x219", "0x21a", "0x21b", "0x21c", "0x254", "0x255", "0x256", "0x257", "0x258", "0x384", "0x385", "0x386", "0x422"] }

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate
# (every stage after a0 opens only when a0's six controls passed)
[stages]
a0 = { alarm = 900 }
m6b = { alarm = 1800, gate = true }
w = { alarm = 900, gate = true }
f9b = { alarm = 1200, gate = true }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "f32dfacc8db804f205fcd5b40c65e01ba0060306"
data = "2d666bfafa21c4d0de0e1e5e87c10dada15b7e45"
pins = [
    "data:render/closing-r7-dpm/bins/p1139-green.bin",
    "data:render/closing-r8-ldpm/score/read.py",
    "data:render/closing-r8-ldpm/gen/ol7/ol7lib.py",
    "data:render/closing-r8-ldpm/gen/ol7/ol7_b_multikick.py",
    "data:cited/closing6/dpm/offline/r6lib.py",
    "data:cited/closing6/dpm/offline/f5lib.py",
    "data:cited/closing6/dpm/offline/f4_phase.py",
    "data:cited/closing6/dpm/offline/f9_loss.py",
    "data:cited/closing6/dpm/offline/f7_replay.py",
    "data:cited/closing6/dpm/offline/FREEZE-f1.sha256",
    "data:cited/closing6/dpm/offline/FREEZE-f4.sha256",
    "data:cited/closing6/dpm/offline/FREEZE-f5.sha256",
    "data:cited/closing6/dpm/offline/FREEZE-f7.sha256",
    "data:cited/closing6/dpm/offline/FREEZE-f9.sha256",
    "data:cited/closing7/b/offline/olib.py",
    "data:cited/closing7/b/offline/g1_walk64.py",
    "data:cited/closing7/b/offline/g2_replay64.py",
    "data:cited/closing7/b/offline/g3_span.py",
    "data:cited/closing7/b/offline/FREEZE-g1.sha256",
    "data:cited/closing7/b/offline/FREEZE-g2.sha256",
    "data:cited/closing7/b/offline/FREEZE-g3.sha256",
    "data:render/closing-r5-dpm/gen/hu1.py",
