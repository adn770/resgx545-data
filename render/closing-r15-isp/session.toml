# session.toml: the env of r15-isp, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r15-isp"
prefix = "r15i"                 # laptop files under ~/scratch/r15i/ (run, stage, out)
srcversion = "B60AB0B475DD1E8972419B5"               # the gma500 module: loaded = installed = this build
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10); E1045's 80 x 40 depth rows
                                    # took 35 ms of render each, E065's 64 x 64 ones 6 ms
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = ["--depth-dump"]      # options naming a file the tool writes: its directory is made
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--kpoke-render", "--kpoke-fill", "--tadata-fill-render", "--scratch-at", "--scratch",
                  "--scratch-pages", "--kpoke-job", "--kpoke-render2", "--kreg-render", "--kreg-render2", "--aa4",
                  "--fault", "--ctx2", "--share-pb", "--isp2", "--dump-render", "--vdm", "--pbe", "--obj2",
                  "--regs", "--depth-store", "--stencil"]

[tools.t10]
path = "sgxfive-test-t10"
sha256 = "9bedc2d6db70b2691698478572e311cf2b9b54acfaf8d714ed4db47852e322eb"
built_from = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"
recipe = "data:render/closing-r10-st1/lead/build_tool10.sh"
source = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next")
# R15-isp (decisions R15-1 to R15-9 (a)): one stage, zcut (Q241), 11 jobs: three controls first, the six cuts,
# E065's bits 16 and 17 last; the session's only stage, so its stop ends it either way
[stages]
zcut = { alarm = 900, on_stop = "end" }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "158bdc5455b233016959a5c7897235ae499c4cdb"
data = "cddc7b60b8edc3cdc40a7d7c21e065b1577fd7f6"
# every repository file the generator (gen/), the scorer or the tests read: the byte copies (r14-isp's guard.py
# and c6's engine q261_rule2.py with its hash file), E1045's kept depth rows (the controls and the engine's
# replay), E065's kept timeline (the 48-pixel job and its siblings), and
# what the replays read (sgx-pipe mte.rs, isp.rs, zls.rs, closing_tables.py)
pins = [
    "data:render/closing-r14-isp/gen/guard.py",
    "data:cited/closing11/plan/c6-q261/q261_rule2.py",
    "data:cited/closing11/plan/c6-q261/q261_rule2.sha256",
    "data:render/closing-r14-isp/out/20261114-060059/wind/wind-zhi.txt.gz",
    "data:render/closing-r14-isp/out/20261114-060059/wind/wind-zhi.depth.1.bin.gz",
    "data:render/closing-r14-isp/out/20261114-060059/wind/wind-zlo.txt.gz",
    "data:render/closing-r14-isp/out/20261114-060059/wind/wind-zlo.depth.1.bin.gz",
    "data:isp/pass-counters/tri-isp-timeline/raw.txt",
    "resgx545:crates/sgx-pipe/src/mte.rs",
    "resgx545:crates/sgx-pipe/src/isp.rs",
    "resgx545:crates/sgx-pipe/src/zls.rs",
    "resgx545:tools/usse-asm/closing_tables.py"
]

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = []
