# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
# f1 (Q108): r14-bif's knobs (E964: the flags on the whole mapping whose first page is the
# address; fork 456404fc sgxfive_debug.c takes 0x2, 0x8, 0x10 and their sums): WRITEONLY 0x2 and
# EDMPROTECT 0x10 together (0x12), on the depth buffer (0x3e001000, rf-c-depth's) or the probe's
# scratch (0x3e003000, f1-ref-a's)
[knobs]
vm_pte_addr = { default = "0", values = ["0", "0x3e001000", "0x3e003000"] }
vm_pte_flags = { default = "0", values = ["0", "0x12"] }

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next")
# closing29/DECISIONS-R29.md (R29-1 to R29-6 a, the user present): s0's safe references first,
# then the flagged stages. f3 (Q241) and f4 (Q112) are not built (README.md deviations 1 and 2).
# Each flagged stage is gated (score.py gate: its own s0 references passed, and no `SGX recovery
# failed` line in any kept file of an earlier stage of the attempt) and ends the session on its
# rc 24 (hook_fault: a failed recovery, an end of the wrong kind, a fault without its BIF line, a
# hang without its hung line; its #limit). Strict health after every fault and hang is the kit's.
[stages]
s0 = { alarm = 900 }
f1 = { alarm = 600, gate = true, on_stop = "end" }
f2 = { alarm = 600, gate = true, on_stop = "end" }
h1 = { alarm = 600, gate = true, on_stop = "end" }
h2 = { alarm = 900, gate = true, on_stop = "end" }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "c0571816c4ff5756af85f2192b02b4a84acdb6ef"
