# session.toml: the env of r42-n3g-g2, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r42-n3g-g2"
prefix = "r42g2"                  # laptop files under ~/scratch/r42g2/ (run, stage, out)
# the r42-kernel module (fork r42-kernel ec6511d5de87), built on cachix and booted once by the
# lead with the user's OK; a placeholder until then (UNBUILT-...): the lead sets the
# booted module's srcversion here and refreezes (README, "Before staging")
srcversion = "079DD0D13F231EEAC52FE0F"               # the gma500 module: loaded = installed = this build
host_key_alias = "cedar"       # ssh HostKeyAlias, unless SGX_TARGET_SSH_OPTS names one
job_timeout = 60                    # seconds one job may take (timeout -k 10)
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t30"            # the tool of the health fill and triangle and the gate
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # options naming a file the tool writes
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--kpoke", "--low", "--late", "--scratch-heap", "--tri", "--fault", "--place",
                  "--poke", "--pds", "--use", "--slot", "--scratch-at", "--refill", "--ctx2"]
                                    # no stage runs a tool row: every row is an owntask row

[tools.t30]
path = "sgxfive-test-t30"
sha256 = "b5ea288d273f0da50884bbeec38f784a5d19773b8ed20efc7937dd455c1b87a5"
built_from = "42c4de7855d6f310321cc03fa0780b698a735e4d:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "253fd15bcb6a0a6381d20aacbb635af1c99d764388f394f9a24dc61266b6418d"
recipe = "data:render/closing-r30-pde/lead/build_tool30_laptop.sh"
source = "42c4de7855d6f310321cc03fa0780b698a735e4d:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "253fd15bcb6a0a6381d20aacbb635af1c99d764388f394f9a24dc61266b6418d"

[knobs]

[kregs]

# the stages in run order; every one flagged, on_stop "end" (any stop ends the session);
# on_gate_fail = "score": the gate's failure (rc 16) is the session's planned, scored end;
# every gate the fill first (the default order)
[stages]
# s: N3g row S, emitsb14s (emitsb14d with the cmd 6 after-read), crumb3 at pdsat=fw14, form=fw14; 2 jobs in one row
s = { alarm = 600, class = "flagged", on_stop = "end", owntask = { blob = "emitsb14s", arm = "slots=0x1 entry=0 pds=crumb3 pdsat=fw14 form=fw14" } }
# q: N3g row Q, emitsb_sb402s (emitsb_sb402 with the cmd 6 after-read), crumb3 at pdsat=fw14, form=sb402; 2 jobs in one row
q = { alarm = 600, class = "flagged", on_stop = "end", on_gate_fail = "score", owntask = { blob = "emitsb_sb402s", arm = "slots=0x1 entry=0 pds=crumb3 pdsat=fw14 form=sb402" } }

# the commits the kit copies and every pinned input are frozen against
[freeze]
resgx545 = "c0e2dc3674965d6c68c7ae730d6334a7f4262aae"
data = "5e9c84b22aceb9c5d141c8085d5c5a79be983276"
# the blobs' and their bases' sources (tests/test_gen.py); r35-sa's kept snap0 (E1144): the
# hooks' V0-V3 fallback; round 41's kept stages H1 c and x, H2 y and LC2 lc: the bases of the
# scorer's test attempts (tests/attempt.py)
pins = [
    "resgx545:asm/fwtask/emitsb14s.s",
    "resgx545:asm/fwtask/emitsb14d.s",
    "resgx545:asm/fwtask/emitsb_sb402s.s",
