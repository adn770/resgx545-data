source_sha256 = "253fd15bcb6a0a6381d20aacbb635af1c99d764388f394f9a24dc61266b6418d"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]

# a register a flagged stage's rows may write (kreg:OFF=V), on the kit's allow-list only
# (KREG_ALLOWED: 0x0a78 up to 0x3f), restored to the kit's default (0x2c) after each job and by
# the exit trap:
#   "0x0a78" = { values = ["0x00", "0x01"] }
[kregs]
"0x0a78" = { values = ["0x00", "0x01", "0x02", "0x03", "0x04", "0x05", "0x06", "0x07", "0x08", "0x09", "0x0a", "0x0b", "0x0c", "0x0d", "0x0e", "0x0f", "0x10", "0x11", "0x12", "0x13", "0x14", "0x15", "0x16", "0x17", "0x18", "0x19", "0x1a", "0x1b", "0x1c", "0x1d", "0x1e", "0x1f", "0x20", "0x21", "0x22", "0x23", "0x24", "0x25", "0x26", "0x27", "0x28", "0x29", "0x2a", "0x2b", "0x2c", "0x2d", "0x2e", "0x2f", "0x30", "0x31", "0x32", "0x33", "0x34", "0x35", "0x36", "0x37", "0x38", "0x39", "0x3a", "0x3b", "0x3c", "0x3d", "0x3e", "0x3f"] }

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next");
# class = "flagged": a stage of planned faults, hangs or kreg writes, after every safe stage
[stages]
s0 = { alarm = 2400, on_stop = "end" }
# one flagged stage a candidate form; each gate opens only on s0's pick (score.py gate), so at
# most one runs; with no pick every gate is shut and the session ends after s0
k10 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }
k20 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }
k40 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }
kl10 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }
kl20 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }
kl40 = { alarm = 3600, gate = true, class = "flagged", on_stop = "end" }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "bf0ba56182633ca2a96ed2c79b3efc68bc8d35f6"
data = "6b5c5112a06ed96cbbcb16655192cfbcb5badc8c"
pins = ["data:render/closing-s1b/bins/p1139-green.bin",      # the pixel program (bins/)
        "data:render/closing-r31-kreg2/fold/posthoc.txt"]   # E1125's renders: tests/ replay them

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = ["bins/*.bin"]
