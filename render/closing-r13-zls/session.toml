# session.toml: the env of r13-zls, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r13-zls"
prefix = "r13z"                 # laptop files under ~/scratch/r13z/ (run, stage, out)
srcversion = "B60AB0B475DD1E8972419B5"               # the gma500 module: loaded = installed = this build
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10); E977's, E988's
                                    # and E986's depth jobs ran in under 2 s
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = ["--depth-dump"]      # options naming a file the tool writes: its directory is made
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = []                 # options no row may use, besides the kit's

[tools.t10]
path = "sgxfive-test-t10"
sha256 = "9bedc2d6db70b2691698478572e311cf2b9b54acfaf8d714ed4db47852e322eb"
built_from = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"
recipe = "data:render/closing-r10-st1/lead/build_tool10.sh"
source = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate
# R13-1 (a), plan sections 2 and 3: zbase (Q243, 11 jobs), zbits (Q071, 16), zfmt (Q120, 6): 33 jobs
# (gen/make.py; README.md "Deviations")
[stages]
zbase = { alarm = 900 }
zbits = { alarm = 1200 }
zfmt = { alarm = 600 }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "05b7039ee0211ac542109667f8693c061ddcde1d"
data = "75d01ee203111b19c8b3cb607a555522b338591c"
# every repository file the generator, scorer or tests read: the kept dumps the controls and the
# zbits rivals compare with (E977's z243-ctl and z242-c-f0, E995's eq-m0, E997's zb-clr-f0, E986's
# z2y-f6, E988/E989's st1-b0 and q071-b0), E986's kept dumps the scorer's tests must hold on (z2y-f0,
# z2x-f7-s00, -sff), E1015's frozen rule (c7_rule.py), the tables of the replicated rows, t10's recipe
# and source (depth_arm, the option forms), the fork-independent sgx-pipe zls.rs (the fold's replay)
pins = [
    "data:render/closing-r9-x/out/20261113-081821/zls/z243-ctl.depth-store.1.bin.gz",
    "data:render/closing-r9-x/out/20261113-081821/zls/z243-ctl.txt.gz",
    "data:render/closing-r9-x/out/20261113-081821/zls/z242-c-f0.depth.1.bin.gz",
    "data:render/closing-r9-x/out/20261113-081821/zls/z242-c-f0.txt.gz",
    "data:render/closing-r10-x/out/20261113-101116/dcmp/eq-m0.depth-store.1.bin.gz",
    "data:render/closing-r10-x/out/20261113-101116/dcmp/eq-m0.txt.gz",
    "data:render/closing-r10-x/out/20261113-101116/zbits/zb-clr-f0.depth.1.bin.gz",
    "data:render/closing-r10-x/out/20261113-101116/zbits/zb-clr-f0.txt.gz",
    "data:render/closing-r10-st1/out/20261113-103934/st1/st1-b0.txt.gz",
    "data:render/closing-r10-st1/out/20261113-103934/st1/q071-b0.txt.gz",
    "data:render/closing-r10-zls/out/20261113-102039/zst2/z2y-f6.depth.1.bin.gz",
    "data:render/closing-r10-zls/out/20261113-102039/zst2/z2y-f6.txt.gz",
    "data:render/closing-r10-zls/out/20261113-102039/zst2/z2y-f0.depth.1.bin.gz",
    "data:render/closing-r10-zls/out/20261113-102039/zst2/z2x-f7-s00.depth.1.bin.gz",
    "data:render/closing-r10-zls/out/20261113-102039/zst2/z2x-f7-sff.depth.1.bin.gz",
    "data:cited/closing11/plan/c7-q120/c7_rule.py",
    "data:render/closing-r9-x/tables/zls.txt",
    "data:render/closing-r10-x/tables/dcmp.txt",
    "data:render/closing-r10-x/tables/zbits.txt",
    "data:render/closing-r10-st1/tables/st1.txt",
    "data:render/closing-r10-zls/tables/zst2.txt",
    "data:render/closing-r10-st1/lead/build_tool10.sh",
    "resgx545:userspace/libsgxfive/tools/sgxfive-test.c",
    "resgx545:crates/sgx-pipe/src/zls.rs"
]

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = []
