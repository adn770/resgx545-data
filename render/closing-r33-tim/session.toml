# session.toml: the env of r33-tim, a closing session built with the session kit (HACKING.md,
# "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r33-tim"
prefix = "r33t"                 # laptop files under ~/scratch/r33t/ (run, stage, out)
srcversion = "7CE8E38EDB97FC5EA4F6C90"               # the gma500 module: loaded = installed = this build
host_key_alias = "cedar"            # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10)
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = []                        # debugfs files the preflight needs besides reset, regs, knobs
outdir_opts = []                    # options naming a file the tool writes: its directory is made
extra_knobs = []                    # the session's own knob words, read by run/hooks.sh
forbid_options = ["--fault", "--poke", "--kpoke-render", "--kpoke-job", "--kpoke-fill",
                  "--kreg-render", "--kreg-render2", "--scratch-at", "--refill", "--geometry",
                  "--final-pb-pages", "--ctx2", "--depth", "--regs"]   # every row is a plain
                                    # 64x64 triangle under regtimeline

[tools.t10]
path = "sgxfive-test-t10"
sha256 = "9bedc2d6db70b2691698478572e311cf2b9b54acfaf8d714ed4db47852e322eb"
built_from = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
built_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"
recipe = "data:render/closing-r10-st1/lead/build_tool10.sh"
source = "a581c06bb24d2f77e03d9b64f7ca1b2d5487b59f:userspace/libsgxfive/tools/sgxfive-test.c"
source_sha256 = "23e1fa76d10bb4e7cfadb0985ac110d4681e4113f2f55f17dd81bdd4b2fe183b"

[tools.rt]
path = "regtimeline"
sha256 = "079f63590ce87ff2a1ac5499291e52340ff448d9c5e41942a9420264764de803"
wraps = true
no_source = "regtimeline (tools/sweep/regtimeline.c): a read-only register sampler that wraps t10; the wrapped command is replayed"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
[knobs]

# a register a flagged stage's rows may write (kreg:OFF=V), on the kit's allow-list only
# (KREG_ALLOWED: 0x0a78 up to 0x3f), restored to the kit's default (0x2c) after each job and by
# the exit trap:
#   "0x0a78" = { values = ["0x00", "0x01"] }
[kregs]

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next");
# class = "flagged": a stage of planned faults, hangs or kreg writes, after every safe stage
[stages]
# in this order (README "What runs"); both safe, every row reads only; a stop of either (a bad
# draw, a missing or cut timeline) ends the session
t1 = { alarm = 900, on_stop = "end" }
t1d = { alarm = 900, on_stop = "end" }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "f888bb7694a629ad7b35e2eb700a55fe2cea885f"
data = "052c0a8bf76bc255474608e8d8d9b9c81c81dbc0"
# the kept rows the tests replay the scorer and the hooks on: r30-evst2's (E1120: CR_EVENT_STATUS
# and CR_CACHE_CTRL around the change, bit 26 in e2-01, not in e2-02) and r32-misc's snapshots
# (E1126, E1127: 0x0acc in snap0 and snap9)
pins = [
    "data:render/closing-r30-evst2/out/20261116-132348/e2/e2-01.txt.gz",
    "data:render/closing-r30-evst2/out/20261116-132348/e2/e2-02.txt.gz",
    "data:render/closing-r32-misc/out/20261116-185655/m2/m2-01.snap0.regs.gz",
    "data:render/closing-r32-misc/out/20261116-185655/m2/m2-01.snap9.regs.gz",
]

# extra laptop files (globs, e.g. "bins/*.bin"), named in args as $S/PATH
[files]
laptop = []
