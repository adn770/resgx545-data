# wl: N3j row W, emitsb_sbc43s (emitsb_sbc43 with the cmd 6 after-read), mark at pdsat=fw14, form=sbc43; 1 job in one row
wl = { alarm = 600, class = "flagged", on_stop = "end", own_gate = "none", end_draws = "none", owntask = { blob = "emitsb_sbc43s", arm = "slots=0x1 entry=0 pds=mark pdsat=fw14 form=sbc43" } }
