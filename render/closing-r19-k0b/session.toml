# session.toml: the env of r19-k0 (round 19 S1, closing19/plan/rank-round19.md section 2: the
# E0CC4027 module's own controls, stages k0 and f0, records E1077 and E1078), built with the session
# kit (HACKING.md, "Session kit"). kit/session.py writes run/session.env from it for the laptop.
name = "r19-k0b"
prefix = "r19k2"                # laptop files under ~/scratch/r19k2/ (run, stage, out)
srcversion = "E0CC40275493F8AEAD8180B"               # the gma500 module: loaded = installed = this build
host_key_alias = "sgx-target"       # ssh HostKeyAlias, unless SGX_TARGET_HOST_KEY_ALIAS or the
                                    # HostKeyAlias of SGX_TARGET_SSH_OPTS names one;
                                    # SGX_TARGET_HOST names the host
job_timeout = 120                   # seconds one job may take (timeout -k 10)
min_free_mb = 300                   # MiB free on ~ before each job (HACKING: at least 200)
health_tool = "t10"            # the tool of the health fill and triangle
debugfs = ["render_param", "render_tadata", "render_words", "buf09"]   # --dump-render, --words
outdir_opts = ["--dump-render", "--words", "--depth-dump"]   # every one writes into $W itself
# read by run/hooks.sh: ctl:KEY=V a control's frozen reading (hook_check stops the stage on
# another), stop:jobfail a final ending neither ok nor overflowed stops the stage (f0-down)
extra_knobs = ["ctl:drawn=2048", "ctl:dsha=92f04c7ca9c6de01", "ctl:dst=2048", "ctl:knob=0x294",
               "ctl:knob=0x6", "ctl:nparts=1", "ctl:ovf1=0", "ctl:ovf1=1", "ctl:ovf2=0",
               "ctl:pmask=ed097a084afcb70a", "ctl:tadata=ddf914f07fc9cda1", "ctl:thr2=0x1de",
               "ctl:thr2=0xde", "stop:jobfail"]
forbid_options = ["--fault", "--scratch-at", "--kpoke-job", "--kpoke-fill", "--kpoke-render2",
                  "--tadata-fill-render", "--refill", "--low", "--late", "--ctx2", "--kreg-render",
                  "--share-pb"]     # the rows' only pokes are zb-c-ctl's (README.md)

