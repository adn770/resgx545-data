[tools.rt]
wraps = true
path = "regtimeline"
sha256 = "079f63590ce87ff2a1ac5499291e52340ff448d9c5e41942a9420264764de803"
no_source = "regtimeline (tools/sweep/regtimeline.c): a read-only register sampler that wraps t10 or t18b; the wrapped command is replayed"

# a debugfs knob a row may write (dbg:NAME=V), restored after the job and by the exit trap:
#   NAME = { default = "0", values = ["0", "1"] }
# render_pb_pages: P (gen/plan.py; thr0 = P - 0x22); render_final_pb_pages: t18b's
# --final-pb-pages writes it itself (the kernel's next context takes it once), declared at 0 only
[knobs]
render_pb_pages = { default = "0x422", values = ["0x2b6", "0xe2", "0x162", "0x28", "0x30", "0x24", "0x100", "0x422"] }
render_final_pb_pages = { default = "0", values = ["0"] }

# the stages in run order; alarm: the Mac's bound on the stage (s); gate = true: score.py gate;
# on_stop = "end": the stage's rc 24 (stopped by its rule) ends the session (default "next")
# R19-1 a: k0 or kg off stops the round (end); kg gated on k0's controls, f0 on k0's and kg's;
# k0 and kg are the plan's stage k0 (E1077), split so that each stage's rows keep the same files
[stages]
k0 = { alarm = 900, on_stop = "end" }
kg = { alarm = 600, gate = true, on_stop = "end" }
f0 = { alarm = 900, gate = true, on_stop = "end" }

# the commits the kit copies and every pinned input are frozen against (never the working tree)
[freeze]
resgx545 = "50606dc1cd1272ada446ac439befa8074f425c69"
data = "95df71e98c9575b7a135ff0b38ae5d58adc5ddee"
