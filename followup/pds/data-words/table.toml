# pds data words: 4 sweeps, 0 probes.
name = "pds-data-words"
needs = ["render"]

[[sweep]]
name = "pds-data-words-copy-every-pds"
about = "every data dword of a 64x32 copy's PDS programs, every-value source"
host = "copy"
options = ["--every-value"]

[[sweep.range]]
space = "pds:prim"

[[sweep.range]]
space = "pds:sec"

[[sweep.range]]
space = "pds:pixev"

[[sweep]]
name = "pds-data-words-pds-copy"
about = "every data dword of a 64x32 copy's PDS programs"
host = "copy"

[[sweep.range]]
space = "pds:prim"

[[sweep.range]]
space = "pds:sec"

[[sweep.range]]
space = "pds:pixev"

[[sweep]]
name = "pds-data-words-pds-fill"
about = "every data dword of a 64x32 fill's PDS programs"
host = "fill"

[[sweep.range]]
space = "pds:prim"

[[sweep.range]]
space = "pds:sec"

[[sweep.range]]
space = "pds:pixev"

[[sweep]]
name = "pds-data-words-pds-tri"
about = "every data dword of the 64x64 triangle's PDS programs"
host = "tri"

[[sweep.range]]
space = "pds:vtx"

[[sweep.range]]
space = "pds:state"

[[sweep.range]]
space = "pds:eos"

[[sweep.range]]
space = "pds:prim"

[[sweep.range]]
space = "pds:bgprim"

