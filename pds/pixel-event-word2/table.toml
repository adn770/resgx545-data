# pds pixel event word 2: 4 sweeps, 0 probes. Bits 16-19 of the pixel-event data dword 2 (Q013): ten times on
# the copy, five on the fill and the triangle, every pixel read.
name = "pds-pixel-event-word2"
needs = ["render"]

[[sweep]]
name = "pds-pixel-event-word2-copy"
about = "bits 16-19 of the copy's pixel-event data dword 2, 10 times each"
host = "copy"
bits = []
values = ["^=0x10000", "^=0x20000", "^=0x40000", "^=0x80000"]
repeat = 10

[[sweep.range]]
space = "pds:pixev"
indices = [2, 2]

[[sweep]]
name = "pds-pixel-event-word2-fill"
about = "bits 16-19 of the fill's pixel-event data dword 2, 5 times each"
host = "fill"
bits = []
values = ["^=0x10000", "^=0x20000", "^=0x40000", "^=0x80000"]
repeat = 5

[[sweep.range]]
space = "pds:pixev"
indices = [2, 2]

[[sweep]]
name = "pds-pixel-event-word2-tri"
about = "bits 16-19 of the tri's pixel-event data dword 2, 5 times each"
host = "tri"
bits = []
values = ["^=0x10000", "^=0x20000", "^=0x40000", "^=0x80000"]
repeat = 5

[[sweep.range]]
space = "pds:pixev"
indices = [2, 2]
